name: Fix learning state merge
on:
  push:
    branches: [fix/sync-all-learning-state]
    paths: ['.github/workflows/fix-learning-state-merge.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          old=re.compile(r"const mergeLog=.*?return out};",re.S)
          new="const mergeHistory=(a,b)=>{const count=x=>(x||[]).reduce((m,d)=>(m[d]=(m[d]||0)+1,m),{}),ca=count(a),cb=count(b),days=[...new Set([...Object.keys(ca),...Object.keys(cb)])].sort();return days.flatMap(d=>Array(Math.max(ca[d]||0,cb[d]||0)).fill(d))};\n            const mergeLog=(a,b)=>{const out={...a};for(const [k,v] of Object.entries(b||{})){const o=out[k]||{},ot=Date.parse(o._syncUpdatedAt||0)||0,vt=Date.parse(v._syncUpdatedAt||0)||0,chosen=vt>=ot?{...o,...v}:{...v,...o};out[k]={...chosen,history:mergeHistory(o.history,v.history),_syncUpdatedAt:new Date(Math.max(ot,vt)||Date.now()).toISOString()}}return out};"
          h,n=old.subn(new,h,count=1)
          if n!=1: raise SystemExit('mergeLog target not found')
          h=h.replace("manual[d]=[...(manual[d]||[]),...v]","manual[d]=unique([...(manual[d]||[]),...v])")
          marker='<!-- learning-state-timestamp-wrapper -->'
          wrapper="<!-- learning-state-timestamp-wrapper -->\n<script>\n(()=>{const rawSave=saveStudyLog;saveStudyLog=function(){try{const prev=JSON.parse(localStorage.getItem('ronshoStudyLog')||'{}'),now=new Date().toISOString();for(const [k,v] of Object.entries(studyLog||{})){const before=prev[k]||{};const a={...v};delete a._syncUpdatedAt;const b={...before};delete b._syncUpdatedAt;if(JSON.stringify(a)!==JSON.stringify(b))v._syncUpdatedAt=now}}catch(_){}return rawSave()}})();\n</script>"
          if marker not in h: h=h.replace('</body>',wrapper+'\n</body>')
          p.write_text(h,encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: merge learning state with per-item timestamps'
          git push
