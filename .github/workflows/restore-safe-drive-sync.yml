name: Restore safe Drive sync
on:
  push:
    branches: [fix/restore-drive-sync-without-word-override]
    paths: ['.github/workflows/restore-safe-drive-sync.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sync module without replacing handleFiles
        run: |
          cat > /tmp/sync.js <<'EOF'
          <!-- safe-google-drive-sync-module -->
          <script>
          (()=>{
            const CLIENT_ID='1008108195377-3i95ujevlk1keuf02tcitnuikniie9al.apps.googleusercontent.com',SCOPE='https://www.googleapis.com/auth/drive.file',NAME='ronsho-app-sync-v1.json',DRIVE_ID='ronshoDriveSyncFileIdV1';
            let token='',timer,last='';
            const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(_){return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
            const state=t=>{const e=document.getElementById('driveSyncState');if(e)e.textContent=t};
            const key=x=>x?.id||x?.key||[x?.title,x?.content,x?.body].filter(Boolean).join('|');
            const unique=a=>{const m=new Map;for(const x of a||[])m.set(key(x)||JSON.stringify(x),x);return [...m.values()]};
            const snapshot=()=>({schemaVersion:2,updatedAt:new Date().toISOString(),entries:window.entries||[],studyLog:read('ronshoStudyLog',{}),manualLog:read('ronshoManualLog',{}),pastExamLogs:read('ronshoPastExamLogsv1',[])});
            const merge=r=>{const remoteEntries=r.entries||Object.values(r.fileBuckets||{}).flat();entries=unique([...(remoteEntries||[]),...(entries||[])]);write('ronshoStudyLog',{...(r.studyLog||{}),...read('ronshoStudyLog',{})});write('ronshoManualLog',{...(r.manualLog||{}),...read('ronshoManualLog',{})});write('ronshoPastExamLogsv1',unique([...(r.pastExamLogs||[]),...read('ronshoPastExamLogsv1',[])]));if(typeof saveEntries==='function')saveEntries();if(typeof renderAll==='function')renderAll()};
            async function fileId(){let i=localStorage.getItem(DRIVE_ID);if(i)return i;const q=encodeURIComponent(\"name = '"+NAME+"' and trashed = false\");const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)',{headers:{Authorization:'Bearer '+token}});i=(await r.json()).files?.[0]?.id;if(i)localStorage.setItem(DRIVE_ID,i);return i}
            async function push(){if(!token)return;const i=await fileId(),b='ronsho',data=snapshot(),meta=JSON.stringify(i?{name:NAME}:{name:NAME,mimeType:'application/json'}),body='--'+b+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(data)+'\r\n--'+b+'--',url=i?'https://www.googleapis.com/upload/drive/v3/files/'+i+'?uploadType=multipart':'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',r=await fetch(url,{method:i?'PATCH':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+b},body});if(!r.ok)throw Error('Driveへの保存に失敗しました');const out=await r.json();localStorage.setItem(DRIVE_ID,out.id||i);last=JSON.stringify(snapshot());state('自動同期済み：'+new Date().toLocaleTimeString())}
            const queue=()=>{clearTimeout(timer);timer=setTimeout(()=>push().catch(e=>state(e.message)),1200)};
            async function connect(){state('Googleログインを開いています…');if(!window.google){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:async r=>{if(r.error)return state('認証に失敗しました');token=r.access_token;try{const i=await fileId();if(i){const x=await fetch('https://www.googleapis.com/drive/v3/files/'+i+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(x.ok)merge(await x.json())}await push()}catch(e){state(e.message)}}}).requestAccessToken({prompt:'consent'})}
            window.addEventListener('load',()=>{const original=window.handleFiles;if(typeof original==='function')window.handleFiles=async function(files){const r=await original.call(this,files);queue();return r};const p=document.createElement('div');p.id='driveSyncPanel';p.style.cssText='margin:12px 0;padding:10px 14px;background:#fff;border:1px solid #9dc4f2;border-radius:12px;font-size:12px;color:#2c4a70';p.innerHTML='<b>☁️ Google Drive同期</b> <button id=\"driveConnectBtn\" type=\"button\">Google Driveに接続</button> <button id=\"driveNowBtn\" type=\"button\">今すぐ同期</button> <span id=\"driveSyncState\">未接続</span>';status.after(p);document.getElementById('driveConnectBtn').onclick=connect;document.getElementById('driveNowBtn').onclick=()=>push().catch(e=>state(e.message));setInterval(()=>{if(token){const n=JSON.stringify(snapshot());if(n!==last)queue()}},3000)})
          })();
          </script>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); h=p.read_text(encoding='utf-8'); s=Path('/tmp/sync.js').read_text(encoding='utf-8')
          if 'safe-google-drive-sync-module' not in h: p.write_text(h.replace('</body>', s+'\n</body>'), encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: restore Drive sync without replacing Word import'
          git push
