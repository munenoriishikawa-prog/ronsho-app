name: Restore safe learning state sync
on:
  push:
    branches: [fix/restore-study-state-sync]
    paths: ['.github/workflows/restore-study-state-sync.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          pattern=re.compile(r"const mergeLog=.*?return out};", re.S)
          replacement="const mergeLog=(a,b)=>{const out={...a};for(const [k,v] of Object.entries(b||{})){const o=out[k]||{};out[k]={...o,...v,history:mergeHistory(o.history,v.history),memorized:!!(o.memorized||v.memorized),starred:!!(o.starred||v.starred),weak:!!(o.weak||v.weak),confidence:v.confidence||o.confidence||null,memo:v.memo||o.memo||''}}return out};"
          h,n=pattern.subn(replacement,h,count=1)
          if n!=1: raise SystemExit('mergeLog target not found')
          h=re.sub(r"\n<!-- learning-state-timestamp-wrapper -->\n<script>.*?</script>\n", "\n", h, flags=re.S)
          p.write_text(h,encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: prevent learning state from being overwritten by empty device state'
          git push
