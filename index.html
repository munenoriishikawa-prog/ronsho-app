<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論証集アプリを読み込み中</title>
<style>body{font-family:Meiryo,sans-serif;margin:40px;background:#e5f0ff;color:#0c2340}#status{background:#fff;padding:20px;border-radius:12px}</style>
</head>
<body>
<div id="status">論証集アプリを読み込んでいます…</div>
<script>
fetch('dist/ronsho_app_v18.7_complete_backup.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('アプリ本体を取得できませんでした（HTTP '+r.status+'）');return r.text()}).then(html=>{if(!html.includes('<!DOCTYPE html')&&!html.includes('<html'))throw new Error('アプリ本体がHTML形式ではありません。');document.open();document.write(html);document.close()}).catch(err=>{document.getElementById('status').innerHTML='<strong>読み込みに失敗しました。</strong><br>'+err.message+'<br><br><a href="dist/ronsho_app_v18.7_complete_backup.html">アプリ本体を直接開く</a>'});
<\/script>
</body>
</html>
