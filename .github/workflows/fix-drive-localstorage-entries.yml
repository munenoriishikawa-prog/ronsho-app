name: Fix Drive localStorage entry sync
on:
  push:
    branches: [fix/drive-sync-read-localstorage-entries]
    paths: ['.github/workflows/fix-drive-localstorage-entries.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          old="const snapshot=()=>({schemaVersion:2,updatedAt:new Date().toISOString(),entries:(typeof entries !== 'undefined' ? entries : []),"
          new="const readEntries=()=>{try{return JSON.parse(localStorage.getItem('ronshoEntries')||'[]')}catch(_){return []}};\n  const snapshot=()=>({schemaVersion:2,updatedAt:new Date().toISOString(),entries:readEntries(),"
          if old not in h: raise SystemExit('sync snapshot target not found')
          p.write_text(h.replace(old,new,1), encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: read imported entries from localStorage for Drive sync'
          git push
