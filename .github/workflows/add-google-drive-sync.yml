name: Add Google Drive sync
on:
  push:
    branches:
      - feature/google-drive-sync
    paths:
      - .github/workflows/add-google-drive-sync.yml
      - assets/google-drive-sync.html
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sync module
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); h=p.read_text(encoding='utf-8'); a=Path('assets/google-drive-sync.html').read_text(encoding='utf-8'); p.write_text(h if '<!-- google-drive-sync-module -->' in h else h.replace('</body>', a+'\n</body>'), encoding='utf-8')"
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: add Google Drive sync and file buckets'
          git push
