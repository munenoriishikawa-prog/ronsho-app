<!-- google-drive-sync-module -->
<script>
(() => {
  const CLIENT_ID='1008108195377-3i95ujevlk1keuf02tcitnuikniie9al.apps.googleusercontent.com', SCOPE='https://www.googleapis.com/auth/drive.file', NAME='ronsho-app-sync-v1.json', BUCKETS='ronshoFileBucketsV1', DRIVE_ID='ronshoDriveSyncFileIdV1';
  let token='', timer, last='';
  const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(_){return d}}, write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  const buckets=()=>read(BUCKETS,{}), saveBuckets=v=>write(BUCKETS,v);
  function rebuild(){entries=Object.values(buckets()).flat();saveEntries();renderAll()}
  function initBuckets(){const b=buckets();if(!Object.keys(b).length&&entries.length){b['既存の読み込みデータ']=entries;saveBuckets(b)}return b}
  const originalHandle=window.handleFiles;
  window.handleFiles=async files=>{try{const b=initBuckets(), names=[];for(const f of files){b[f.name]=(await parseSingleFile(f)).map(x=>({...x,sourceFile:f.name}));names.push(f.name)}saveBuckets(b);rebuild();status.textContent=names.join('、')+' を保存しました（同名ファイルは更新）';queue()}catch(e){console.error(e);return originalHandle(files)}};
  const payload=()=>({schemaVersion:1,updatedAt:new Date().toISOString(),fileBuckets:initBuckets(),studyLog:read('ronshoStudyLog',{}),manualLog:read('ronshoManualLog',{}),pastExamLogs:read('ronshoPastExamLogsv1',[])});
  function merge(remote){const local=payload(), b={...(remote.fileBuckets||{}),...local.fileBuckets};saveBuckets(b);const st={...(remote.studyLog||{})};for(const [k,v] of Object.entries(local.studyLog||{})){const o=st[k]||{};st[k]={...o,...v,history:[...new Set([...(o.history||[]),...(v.history||[])])].sort()}}write('ronshoStudyLog',st);const ml={...(remote.manualLog||{})};for(const [k,v] of Object.entries(local.manualLog||{}))ml[k]=[...(ml[k]||[]),...v];write('ronshoManualLog',ml);const pl=new Map((remote.pastExamLogs||[]).map(x=>[x.key,x]));(local.pastExamLogs||[]).forEach(x=>pl.set(x.key,x));write('ronshoPastExamLogsv1',[...pl.values()]);rebuild()}
  const state=t=>{const e=document.getElementById('driveSyncState');if(e)e.textContent=t};
  async function id(){let i=localStorage.getItem(DRIVE_ID);if(i)return i;const q=encodeURIComponent("name = '"+NAME+"' and trashed = false");const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)',{headers:{Authorization:'Bearer '+token}});i=(await r.json()).files?.[0]?.id;if(i)localStorage.setItem(DRIVE_ID,i);return i}
  async function push(){if(!token)return;const i=await id(), b='ronsho', data=payload(), m=JSON.stringify(i?{name:NAME}:{name:NAME,mimeType:'application/json'}), body='--'+b+'\r\nContent-Type: application/json\r\n\r\n'+m+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(data)+'\r\n--'+b+'--', url=i?'https://www.googleapis.com/upload/drive/v3/files/'+i+'?uploadType=multipart':'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', r=await fetch(url,{method:i?'PATCH':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+b},body});if(!r.ok)throw Error('Driveへの保存に失敗しました');const out=await r.json();localStorage.setItem(DRIVE_ID,out.id||i);last=JSON.stringify(payload());state('自動同期済み：'+new Date().toLocaleTimeString())}
  const queue=()=>{clearTimeout(timer);timer=setTimeout(()=>push().catch(e=>state(e.message)),1200)};
  async function connect(){state('Googleログインを開いています…');if(!window.google){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:async r=>{if(r.error)return state('認証に失敗しました');token=r.access_token;try{const i=await id();if(i){const x=await fetch('https://www.googleapis.com/drive/v3/files/'+i+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(x.ok)merge(await x.json())}await push()}catch(e){state(e.message)}}}).requestAccessToken({prompt:'consent'})}
  function panel(){const p=document.createElement('div');p.id='driveSyncPanel';p.style.cssText='margin:12px 0;padding:10px 14px;background:#fff;border:1px solid #9dc4f2;border-radius:12px;font-size:12px;color:#2c4a70';p.innerHTML='<b>☁️ Google Drive同期</b> <button id="driveConnectBtn" type="button">Google Driveに接続</button> <button id="driveNowBtn" type="button">今すぐ同期</button> <span id="driveSyncState">未接続</span>';status.after(p);document.getElementById('driveConnectBtn').onclick=connect;document.getElementById('driveNowBtn').onclick=()=>push().catch(e=>state(e.message));setInterval(()=>{if(token){const n=JSON.stringify(payload());if(n!==last)queue()}},3000)}
  window.addEventListener('load',()=>{initBuckets();rebuild();panel()});
})();
</script>
