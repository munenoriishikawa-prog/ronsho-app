name: Replace Drive sync with merge-safe implementation
on:
  push:
    branches: [fix/persist-drive-entries-on-restore]
    paths: ['.github/workflows/replace-drive-sync-with-merge.yml']
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/sync.js <<'EOF'
          <!-- merge-safe-google-drive-sync-module -->
          <script>
          (()=>{
            const CLIENT_ID='1008108195377-3i95ujevlk1keuf02tcitnuikniie9al.apps.googleusercontent.com',SCOPE='https://www.googleapis.com/auth/drive.file',NAME='ronsho-app-sync-v1.json',DRIVE_ID='ronshoDriveSyncFileIdV1',ENTRY_KEY='ronshoEntries';
            let token='',timer,last='';
            const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(_){return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
            const getEntries=()=>read(ENTRY_KEY,[]),entryKey=x=>x?.id||[x?.title,x?.body].filter(Boolean).join('|')||JSON.stringify(x),unique=a=>{const m=new Map;for(const x of a||[])m.set(entryKey(x),x);return [...m.values()]};
            const state=t=>{const e=document.getElementById('driveSyncState');if(e)e.textContent=t};
            const snapshot=()=>({schemaVersion:3,updatedAt:new Date().toISOString(),entries:getEntries(),studyLog:read('ronshoStudyLog',{}),manualLog:read('ronshoManualLog',{}),pastExamLogs:read('ronshoPastExamLogsv1',[])});
            const mergeLog=(a,b)=>{const out={...a};for(const [k,v] of Object.entries(b||{})){const o=out[k]||{};const ah=o.history||[],bh=v.history||[];out[k]={...o,...v,history:[...new Set([...ah,...bh])].sort(),memorized:!!(o.memorized||v.memorized),starred:!!(o.starred||v.starred),confidence:v.confidence||o.confidence||null,memo:v.memo||o.memo||''}}return out};
            const merge=remote=>{const local=snapshot(),remoteEntries=remote.entries||Object.values(remote.fileBuckets||{}).flat();const mergedEntries=unique([...(remoteEntries||[]),...local.entries]);write(ENTRY_KEY,mergedEntries);try{entries=mergedEntries}catch(_){}const study=mergeLog(remote.studyLog||{},local.studyLog||{});write('ronshoStudyLog',study);const manual={...(remote.manualLog||{})};for(const [d,v] of Object.entries(local.manualLog||{}))manual[d]=[...(manual[d]||[]),...v];write('ronshoManualLog',manual);const exams=new Map([...(remote.pastExamLogs||[]),...(local.pastExamLogs||[])].map(x=>[x.key||JSON.stringify(x),x]));write('ronshoPastExamLogsv1',[...exams.values()]);if(typeof saveEntries==='function')saveEntries();if(typeof renderAll==='function')renderAll();state('統合済み：Drive '+(remoteEntries||[]).length+'件／このPC '+local.entries.length+'件／統合後 '+mergedEntries.length+'件');return snapshot()};
            async function fileId(){let i=localStorage.getItem(DRIVE_ID);if(i)return i;const q=encodeURIComponent("name = '"+NAME+"' and trashed = false");const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)',{headers:{Authorization:'Bearer '+token}});const files=(await r.json()).files||[];i=files[0]?.id;if(i)localStorage.setItem(DRIVE_ID,i);return i}
            async function push(data=snapshot()){if(!token)return;const i=await fileId(),b='ronsho',meta=JSON.stringify(i?{name:NAME}:{name:NAME,mimeType:'application/json'}),body='--'+b+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(data)+'\r\n--'+b+'--',url=i?'https://www.googleapis.com/upload/drive/v3/files/'+i+'?uploadType=multipart':'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',r=await fetch(url,{method:i?'PATCH':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+b},body});if(!r.ok)throw Error('Driveへの保存に失敗しました');const out=await r.json();localStorage.setItem(DRIVE_ID,out.id||i);last=JSON.stringify(snapshot());state('同期済み：'+data.entries.length+'件 '+new Date().toLocaleTimeString())}
            const queue=()=>{clearTimeout(timer);timer=setTimeout(()=>push().catch(e=>state(e.message)),1200)};
            async function connect(){state('Googleログインを開いています…');if(!window.google){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:async r=>{if(r.error)return state('認証に失敗しました');token=r.access_token;try{const i=await fileId();let data=snapshot();if(i){const x=await fetch('https://www.googleapis.com/drive/v3/files/'+i+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(x.ok)data=merge(await x.json())}await push(data)}catch(e){state(e.message)}}}).requestAccessToken({prompt:'consent'})}
            window.addEventListener('load',()=>{const old=document.getElementById('driveSyncPanel');if(old)old.remove();const p=document.createElement('div');p.id='driveSyncPanel';p.style.cssText='margin:12px 0;padding:10px 14px;background:#fff;border:1px solid #9dc4f2;border-radius:12px;font-size:12px;color:#2c4a70';p.innerHTML='<b>☁️ Google Drive同期</b> <button id="driveConnectBtn" type="button">Google Driveに接続</button> <button id="driveNowBtn" type="button">今すぐ同期</button> <span id="driveSyncState">未接続</span>';status.after(p);document.getElementById('driveConnectBtn').onclick=connect;document.getElementById('driveNowBtn').onclick=async()=>{try{const i=await fileId();let data=snapshot();if(i){const x=await fetch('https://www.googleapis.com/drive/v3/files/'+i+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(x.ok)data=merge(await x.json())}await push(data)}catch(e){state(e.message)}};setInterval(()=>{if(token){const n=JSON.stringify(snapshot());if(n!==last)queue()}},3000)})
          })();
          </script>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); h=p.read_text(encoding='utf-8'); start='<!-- safe-google-drive-sync-module -->'; i=h.find(start)
          if i >= 0:
              j=h.find('</script>',i)
              if j < 0: raise SystemExit('existing sync end tag not found')
              h=h[:i]+h[j+len('</script>'):]
          s=Path('/tmp/sync.js').read_text(encoding='utf-8')
          if 'merge-safe-google-drive-sync-module' not in h: h=h.replace('</body>',s+'\n</body>')
          p.write_text(h,encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: make Drive sync merge data across devices'
          git push
