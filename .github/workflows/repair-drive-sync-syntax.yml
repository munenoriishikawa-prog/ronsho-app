name: Repair Drive sync syntax
on:
  push:
    branches: [fix/drive-sync-button-syntax]
    paths: ['.github/workflows/repair-drive-sync-syntax.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          perl -pi -e 's/\\+"/"/g' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: repair Drive sync JavaScript syntax'
          git push
