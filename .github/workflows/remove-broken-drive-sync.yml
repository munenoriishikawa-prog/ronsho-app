name: Remove broken Drive sync
on:
  push:
    branches: [fix/restore-word-import]
    paths: ['.github/workflows/remove-broken-drive-sync.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); h=p.read_text(encoding='utf-8'); m='<!-- google-drive-sync-module -->'; p.write_text((h.split(m,1)[0]+'\n</body>\n</html>\n') if m in h else h, encoding='utf-8')"
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: restore Word import'
          git push
