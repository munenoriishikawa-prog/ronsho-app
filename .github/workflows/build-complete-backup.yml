name: Build complete JSON backup HTML
on:
  push:
    branches: [feature/complete-json-backup]
    paths:
      - 'legacy:ronsho_app_v18.7_with_past_exam_log_v2.html'
      - 'tools/build_complete_backup.mjs'
      - '.github/workflows/build-complete-backup.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build_complete_backup.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/ronsho_app_v18.7_complete_backup.html
          git diff --cached --quiet || git commit -m 'build: generate complete JSON backup HTML'
          git push
