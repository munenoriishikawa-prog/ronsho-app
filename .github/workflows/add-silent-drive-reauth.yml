name: Add silent Drive reauthentication
on:
  push:
    branches: [fix/silent-drive-reauth]
    paths: ['.github/workflows/add-silent-drive-reauth.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          old="async function connect(){state('Googleログインを開いています…');if(!window.google){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:async r=>{if(r.error)return state('認証に失敗しました');token=r.access_token;try{const i=await fileId();let data=snapshot();if(i){const x=await fetch('https://www.googleapis.com/drive/v3/files/'+i+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(x.ok)data=merge(await x.json())}await push(data)}catch(e){state(e.message)}}}).requestAccessToken({prompt:'consent'})}"
          new="async function connect(prompt='consent'){if(prompt)state('Googleログインを開いています…');if(!window.google){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:async r=>{if(r.error){if(!prompt)state('未接続');else state('認証に失敗しました');return}token=r.access_token;localStorage.setItem('ronshoDriveSyncAuthorizedV1','1');try{const i=await fileId();let data=snapshot();if(i){const x=await fetch('https://www.googleapis.com/drive/v3/files/'+i+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(x.ok)data=merge(await x.json())}await push(data)}catch(e){state(e.message)}}}).requestAccessToken({prompt})}"
          if old not in h: raise SystemExit('connect target not found')
          h=h.replace(old,new,1)
          old2="document.getElementById('driveConnectBtn').onclick=connect;"
          new2="document.getElementById('driveConnectBtn').onclick=()=>connect('consent');if(localStorage.getItem('ronshoDriveSyncAuthorizedV1')==='1')connect('').catch(()=>state('未接続'));"
          if old2 not in h: raise SystemExit('button target not found')
          h=h.replace(old2,new2,1)
          p.write_text(h,encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: restore Drive auth silently after initial consent'
          git push
