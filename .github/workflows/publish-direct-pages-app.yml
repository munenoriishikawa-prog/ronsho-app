name: Publish direct Pages app
on:
  push:
    branches: [fix/pages-direct-app]
    paths:
      - '.github/workflows/publish-direct-pages-app.yml'
      - 'dist/ronsho_app_v18.7_complete_backup.html'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp dist/ronsho_app_v18.7_complete_backup.html index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'build: publish app as root index.html'
          git push
