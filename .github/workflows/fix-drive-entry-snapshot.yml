name: Fix Drive entry snapshot
on:
  push:
    branches: [fix/sync-imported-subjects-across-devices]
    paths: ['.github/workflows/fix-drive-entry-snapshot.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          perl -0pi -e "s/window\.entries\|\|\[\]/(typeof entries !== 'undefined' ? entries : [])/g" index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: sync imported subjects from app data'
          git push
